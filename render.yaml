services:
  # Backend API
  - type: web
    name: jhep-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: POSTGRES_DB
        fromDatabase:
          name: jhep-db
          property: database
      - key: POSTGRES_USER
        fromDatabase:
          name: jhep-db
          property: user
      - key: POSTGRES_PASSWORD
        fromDatabase:
          name: jhep-db
          property: password
      - key: POSTGRES_HOST
        fromDatabase:
          name: jhep-db
          property: host
      - key: POSTGRES_PORT
        fromDatabase:
          name: jhep-db
          property: port
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 30
      - key: CORS_ORIGINS
        value: "*"
      - key: PORT
        value: 8000
    buildFilter:
      paths:
        - backend/**
    startCommand: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port ${PORT:-8000}"

  # Frontend
  - type: web
    name: jhep-frontend
    runtime: docker
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    plan: free
    envVars:
      - key: PORT
        value: 3000
      - key: NODE_ENV
        value: production
    buildFilter:
      paths:
        - frontend/**
    # If frontend needs API URL at build time, add build args
    # dockerBuildArgs:
    #   - key: NEXT_PUBLIC_API_BASE_URL
    #     value: https://jhep-backend.onrender.com

databases:
  - name: jhep-db
    plan: free
    databaseName: jhep_db
    user: jhep
