# Jira <-> GitHub environment mapping (JHEP-56).
# The Jira Cloud for GitHub integration maps deployments to Jira
# environment types by matching the GitHub environment NAME; names that
# match nothing show up as "unmapped" and stay invisible in Jira's
# deployments view. This file overrides the built-in text matching —
# which also means Jira stops auto-detecting entirely, so every
# environment name we use must be listed here.
#
# Contract (see docs/configuration.md):
#   preview    <- pushes to dev (Render auto-deploy)   -> Jira: development
#   production <- future production hosting (main)     -> Jira: production
deployments:
  environmentMapping:
    development:
      - "preview"
    production:
      - "production"
