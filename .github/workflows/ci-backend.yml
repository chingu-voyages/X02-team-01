name: CI - Backend

on:
  push:
    branches: [main, dev]
    paths:
      - "backend/**"
      - "compose.yaml"
      - ".env.example"
      - ".github/workflows/ci-backend.yml"
  # No path filter on pull_request: this workflow provides required status
  # checks, so it must report on every PR or merges would stay blocked.
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Lint & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version-file: backend/.python-version
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Test
        run: pytest -q

  compose:
    name: Compose & Postgres integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Create local env file
        run: cp .env.example .env

      - name: Validate compose configuration
        run: docker compose config --quiet

      - name: Start Postgres and wait for healthcheck
        run: docker compose up -d --wait postgres

      # The opt-in DB suite now runs in CI against the real Postgres
      # service above (fixtures refuse remote-host databases, which CI
      # runners satisfy — localhost only).
      - uses: actions/setup-python@v7
        with:
          python-version-file: backend/.python-version
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Run PostgreSQL integration suite
        working-directory: backend
        run: pytest -q
        env:
          RUN_DB_INTEGRATION: "1"
          POSTGRES_DB: jhep_db
          POSTGRES_USER: jhep
          POSTGRES_PASSWORD: replace_with_local_password

      - name: Tear down
        if: always()
        run: docker compose down -v
