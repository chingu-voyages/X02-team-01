name: CI - Backend

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "compose.yaml"
      - ".env.example"
      - ".github/workflows/ci-backend.yml"
  pull_request:
    paths:
      - "backend/**"
      - "compose.yaml"
      - ".env.example"
      - ".github/workflows/ci-backend.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Lint & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Test
        # pytest exits 5 when no tests are collected, which is tolerated
        # until the team adds a test suite
        run: pytest -q || [ $? -eq 5 ]

  compose:
    name: Compose config & Postgres healthcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create local env file
        run: cp .env.example .env

      - name: Validate compose configuration
        run: docker compose config --quiet

      - name: Start Postgres and wait for healthcheck
        run: docker compose up -d --wait postgres

      - name: Tear down
        if: always()
        run: docker compose down -v
