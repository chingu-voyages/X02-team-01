name: CI - Docker

on:
  push:
    branches: [main, dev]
    paths:
      - "frontend/**"
      - "backend/**"
      - ".github/workflows/ci-docker.yml"
  # No path filter on pull_request: this workflow provides required status
  # checks, so it must report on every PR or merges would stay blocked.
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build images (no push)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build frontend image
        run: docker build -t x02-frontend:ci ./frontend

      - name: Build backend image
        run: docker build -t x02-backend:ci ./backend
