name: CD - Verified Render deployments for Jira

# JHEP-176: Report actual Render deploys to GitHub, which the GitHub for
# Atlassian app can forward into Jira's Deployment Frequency report.
# Render is the deployer; this workflow only verifies and reports its state.
# No deployment is marked successful until BOTH services serve the exact SHA.

on:
  push:
    branches: [dev, main]
    paths:
      - "frontend/**"
      - "backend/**"
      - ".github/workflows/cd-deployment-status.yml"
  # Use this after a manual Render deployment or to report an already-live SHA.
  # A manual run does not itself redeploy anything.
  workflow_dispatch:
    inputs:
      target_environment:
        description: "Render environment to verify and report"
        required: true
        type: choice
        options:
          - development
          - production
      deployed_sha:
        description: "Full SHA currently live on BOTH services (blank = this workflow's SHA)"
        required: false
        type: string

permissions:
  contents: read
  deployments: write

concurrency:
  group: render-deployment-tracking-${{ github.ref }}
  cancel-in-progress: false

jobs:
  report:
    name: Verify Render deployment and report to Jira
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Select environment and commit
        id: config
        env:
          EVENT_NAME: ${{ github.event_name }}
          BRANCH: ${{ github.ref_name }}
          GIT_SHA: ${{ github.sha }}
          REQUESTED_ENV: ${{ inputs.target_environment }}
          REQUESTED_SHA: ${{ inputs.deployed_sha }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            ENVIRONMENT="$REQUESTED_ENV"
            SHA="${REQUESTED_SHA:-$GIT_SHA}"
          else
            case "$BRANCH" in
              dev) ENVIRONMENT="development" ;;
              main) ENVIRONMENT="production" ;;
              *) echo "Unexpected branch: $BRANCH" >&2; exit 1 ;;
            esac
            SHA="$GIT_SHA"
          fi

          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "A full 40-character commit SHA is required" >&2
            exit 1
          }

          case "$ENVIRONMENT" in
            development)
              FRONTEND_ID="srv-dbuci44ipgvc738h1nt0"
              BACKEND_ID="srv-dbubt18jo6nc739keo40"
              FRONTEND_URL="https://jhep-frontend-dev.onrender.com"
              BACKEND_URL="https://jhep-backend-dev.onrender.com"
              IS_PRODUCTION="false"
              ;;
            production)
              FRONTEND_ID="srv-dbv0j4qjnfac73c7qim0"
              BACKEND_ID="srv-dbv0875g1s2s73dpggig"
              FRONTEND_URL="https://jhep-frontend-prod.onrender.com"
              BACKEND_URL="https://jhep-backend-prod.onrender.com"
              IS_PRODUCTION="true"
              ;;
            *) echo "Unknown environment: $ENVIRONMENT" >&2; exit 1 ;;
          esac

          {
            echo "environment=$ENVIRONMENT"
            echo "sha=$SHA"
            echo "frontend_id=$FRONTEND_ID"
            echo "backend_id=$BACKEND_ID"
            echo "frontend_url=$FRONTEND_URL"
            echo "backend_url=$BACKEND_URL"
            echo "is_production=$IS_PRODUCTION"
          } >> "$GITHUB_OUTPUT"

          echo "Checking $ENVIRONMENT against commit $SHA"

      - name: Require Render API key
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          if [[ -z "$RENDER_API_KEY" ]]; then
            echo "Add RENDER_API_KEY to GitHub Actions repository secrets first." >&2
            exit 1
          fi

      - name: Create or reuse GitHub deployment
        id: deployment
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ steps.config.outputs.sha }}
          ENVIRONMENT: ${{ steps.config.outputs.environment }}
          FRONTEND_URL: ${{ steps.config.outputs.frontend_url }}
          IS_PRODUCTION: ${{ steps.config.outputs.is_production }}
        run: |
          set -euo pipefail

          # Re-running a workflow shouldn't inflate deployment frequency.
          DEPLOYMENT_ID="$(gh api --method GET "repos/$REPO/deployments" \
            -f "sha=$SHA" -f "environment=$ENVIRONMENT" -f "per_page=100" \
            --jq '[.[] | select((.description // "") | startswith("JHEP verified Render")) | .id][0] // empty')"

          if [[ -z "$DEPLOYMENT_ID" ]]; then
            jq -n \
              --arg ref "$SHA" \
              --arg environment "$ENVIRONMENT" \
              --arg url "$FRONTEND_URL" \
              --argjson production "$IS_PRODUCTION" \
              '{
                ref: $ref,
                environment: $environment,
                description: ("JHEP verified Render " + $environment),
                production_environment: $production,
                auto_merge: false,
                required_contexts: [],
                payload: {frontend_url: $url}
              }' | gh api --method POST "repos/$REPO/deployments" \
                --input - --jq '.id' > deployment-id.txt
            DEPLOYMENT_ID="$(cat deployment-id.txt)"
          fi

          echo "deployment_id=$DEPLOYMENT_ID" >> "$GITHUB_OUTPUT"
          echo "GitHub deployment: $DEPLOYMENT_ID"

      - name: Mark deployment in progress
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          DEPLOYMENT_ID: ${{ steps.deployment.outputs.deployment_id }}
          FRONTEND_URL: ${{ steps.config.outputs.frontend_url }}
        run: |
          gh api --method POST \
            "repos/$REPO/deployments/$DEPLOYMENT_ID/statuses" \
            -f state=in_progress \
            -f "environment_url=$FRONTEND_URL" \
            -f "log_url=https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            -f description="Waiting for real Render deployments"

      - name: Wait for matching live frontend and backend
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          SHA: ${{ steps.config.outputs.sha }}
          FRONTEND_ID: ${{ steps.config.outputs.frontend_id }}
          BACKEND_ID: ${{ steps.config.outputs.backend_id }}
          FRONTEND_URL: ${{ steps.config.outputs.frontend_url }}
          BACKEND_URL: ${{ steps.config.outputs.backend_url }}
        run: |
          set -euo pipefail

          for attempt in $(seq 1 48); do
            LIVE_COUNT=0
            for SERVICE in "$FRONTEND_ID" "$BACKEND_ID"; do
              RESPONSE="$(curl --fail --silent --show-error \
                --retry 2 --max-time 20 \
                -H "Authorization: Bearer $RENDER_API_KEY" \
                -H "Accept: application/json" \
                "https://api.render.com/v1/services/$SERVICE/deploys?limit=30")"

              # Render returns [{"deploy":{"commit":{"id": ...}, "status": ...}}].
              STATUS="$(jq -r --arg sha "$SHA" \
                '[.[] | .deploy | select(.commit.id == $sha) | .status][0] // "not_found"' \
                <<< "$RESPONSE")"

              echo "Attempt $attempt: $SERVICE => $STATUS"
              case "$STATUS" in
                live) LIVE_COUNT=$((LIVE_COUNT + 1)) ;;
                build_failed|update_failed|pre_deploy_failed|canceled)
                  echo "Render deployment failed for $SERVICE ($STATUS)" >&2
                  exit 1
                  ;;
              esac
            done

            if [[ "$LIVE_COUNT" == "2" ]]; then
              curl --fail --silent --show-error --location --max-time 20 \
                "$BACKEND_URL/health" >/dev/null
              curl --fail --silent --show-error --location --max-time 20 \
                "$FRONTEND_URL/login" >/dev/null
              echo "Both Render services serve SHA $SHA and respond over HTTPS."
              exit 0
            fi

            sleep 25
          done

          echo "Timed out waiting for both Render services to run SHA $SHA" >&2
          exit 1

      - name: Mark verified deployment successful
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          DEPLOYMENT_ID: ${{ steps.deployment.outputs.deployment_id }}
          FRONTEND_URL: ${{ steps.config.outputs.frontend_url }}
        run: |
          gh api --method POST \
            "repos/$REPO/deployments/$DEPLOYMENT_ID/statuses" \
            -f state=success \
            -f "environment_url=$FRONTEND_URL" \
            -f "log_url=https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            -f description="Both Render services live on the expected commit"

      - name: Mark deployment failed
        if: failure() && steps.deployment.outputs.deployment_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          DEPLOYMENT_ID: ${{ steps.deployment.outputs.deployment_id }}
          FRONTEND_URL: ${{ steps.config.outputs.frontend_url }}
        run: |
          gh api --method POST \
            "repos/$REPO/deployments/$DEPLOYMENT_ID/statuses" \
            -f state=failure \
            -f "environment_url=$FRONTEND_URL" \
            -f "log_url=https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            -f description="Render deployment did not pass verification"
